name: Deploy Portfolio to GitHub Pages

# Static, build-free deploy of the 3D single-page portfolio.
# Publishes to the gh-pages branch (matches existing Pages config) — near-instant.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp robots.txt _site/
          cp sitemap.xml _site/
          cp -r assets _site/assets
          # SPA-style fallback so deep links / refreshes resolve to the page
          cp index.html _site/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
